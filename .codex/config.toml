[features]
hooks = true

[agents]
max_concurrent_threads_per_session = 16
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[agents.tcti-llvm-inspector]
description = "Orlix TCTI LLVM inspector: reports exact ELF, Mach-O, disassembly, relocation, symbol, section, and LLDB facts without changing source. See .codex/subagents/tcti-llvm-inspector.md."

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
required = false
tool_timeout_sec = 60

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false
required = false
tool_timeout_sec = 60

[mcp_servers.context7.env_http_headers]
CONTEXT7_API_KEY = "CONTEXT7_API_KEY"

[mcp_servers.lldb]
command = "/bin/zsh"
args = [ "-lc", "exec \"$(xcrun --find lldb-mcp)\"" ]
required = false
tool_timeout_sec = 60
