name: macOS kernel runner setup
description: Select the pinned Xcode and restore the Bazel repository cache for OrlixKernelMachOArchive.
runs:
  using: composite
  steps:
    - name: Read requested Xcode version
      id: xcode-version
      shell: bash
      run: |
        set -euo pipefail
        test -s .xcode-version
        echo "version=$(tr -d '[:space:]' < .xcode-version)" >> "$GITHUB_OUTPUT"

    - name: See whether the requested Xcode is already on the runner
      id: xcode-present
      shell: bash
      run: |
        set -euo pipefail
        if python3 bazel/ci/setup_cache.py xcode-present --version "${{ steps.xcode-version.outputs.version }}" || python3 bazel/ci/setup_cache.py xcode-selected --version "${{ steps.xcode-version.outputs.version }}"; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Select Xcode
      if: steps.xcode-present.outputs.installed == 'true'
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ steps.xcode-version.outputs.version }}

    - name: Restore cached Xcode archive
      if: steps.xcode-present.outputs.installed != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: "~/Library/Application Support/com.robotsandpencils.xcodes"
        key: orlix-xcode-${{ steps.xcode-version.outputs.version }}-17F113

    - name: Install the requested Xcode from the cache or Apple
      if: steps.xcode-present.outputs.installed != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v xcodes >/dev/null 2>&1; then
          export HOMEBREW_NO_AUTO_UPDATE=1
          xcodes_tap_revision=6e47b55144cb1d1f5948e0bb6f443b13a8a8efc2
          brew tap xcodesorg/made
          git -C "$(brew --repo xcodesorg/made)" fetch origin "$xcodes_tap_revision"
          git -C "$(brew --repo xcodesorg/made)" checkout "$xcodes_tap_revision"
          brew trust --formula xcodesorg/made/xcodes
          brew install xcodesorg/made/xcodes
          test "$(git -C "$(brew --repo xcodesorg/made)" rev-parse HEAD)" = "$xcodes_tap_revision"
        fi
        xcodes install "${{ steps.xcode-version.outputs.version }}"
        xcodes select --print-path

    - name: Restore Bazel repository cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/Orlix/Bazel/repository-cache
        key: orlix-bazel-repos-${{ hashFiles('MODULE.bazel.lock', 'bazel/extensions/ghostty_zig_packages.json') }}
        restore-keys: |
          orlix-bazel-repos-

    - name: Export the selected Xcode to Make
      shell: bash
      run: |
        set -euo pipefail
        echo "ORLIX_PINNED_DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
        echo "ORLIX_BAZEL_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
