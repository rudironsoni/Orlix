name: Promote TestFlight beta to App Review

on:
  workflow_dispatch:
    inputs:
      beta_tag:
        description: Protected beta tag, for example ios-v0.1-b42
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: app-store-review-${{ inputs.beta_tag }}
  cancel-in-progress: false

jobs:
  submit-for-review:
    name: Submit exact beta for App Review
    runs-on: ubuntu-24.04
    environment: app-store-review
    timeout-minutes: 30
    env:
      ORLIX_RELEASE_REPOSITORY: ${{ github.repository }}
      ORLIX_RELEASE_TAG: ${{ inputs.beta_tag }}
      ORLIX_RELEASE_REPORT_INPUT: ${{ github.workspace }}/beta-evidence/AgentHarness/orlix-release/release.json

    steps:
      - name: Check out the protected beta tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.beta_tag }}
          fetch-depth: 0

      - name: Resolve the tag and successful beta run
        id: beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          commit="$(git rev-list -n 1 "refs/tags/$ORLIX_RELEASE_TAG")"
          test -n "$commit"
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/testflight-beta.yml/runs?event=push&status=success&head_sha=$commit" --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id" || { echo "No successful beta workflow exists for $ORLIX_RELEASE_TAG at $commit" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "ORLIX_RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "ORLIX_RELEASE_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Download exact beta evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orlix-testflight-${{ inputs.beta_tag }}
          path: beta-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.beta.outputs.run_id }}

      - name: Set up Ruby and pinned Fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.8"
          bundler-cache: true

      - name: Materialize App Store Connect credentials
        env:
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPSTORE_API_PRIVATE_KEY"
          umask 077
          private_key="$RUNNER_TEMP/AuthKey.p8"
          export ORLIX_FASTLANE_API_KEY_PATH="$RUNNER_TEMP/appstore-api-key.json"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$private_key"
          export private_key
          ruby -rjson -e 'File.write(ENV.fetch("ORLIX_FASTLANE_API_KEY_PATH"), JSON.pretty_generate({key_id: ENV.fetch("APPSTORE_API_KEY_ID"), issuer_id: ENV.fetch("APPSTORE_ISSUER_ID"), key_filepath: ENV.fetch("private_key"), in_house: false}))'
          echo "ORLIX_FASTLANE_API_KEY_PATH=$ORLIX_FASTLANE_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate and submit the exact beta
        run: make app-store-promote
