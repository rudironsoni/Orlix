name: Bazel component benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "39 4 * * 0"

permissions:
  contents: read

concurrency:
  group: bazel-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Measure clean and cached component builds
    if: github.ref == 'refs/heads/main' && github.repository == 'rudironsoni/Orlix'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read requested Xcode version
        id: xcode-version
        run: |
          set -euo pipefail
          test -s .xcode-version
          echo "version=$(tr -d '[:space:]' < .xcode-version)" >> "$GITHUB_OUTPUT"

      - name: See whether the requested Xcode is already on the runner
        id: xcode-present
        run: |
          set -euo pipefail
          if python3 bazel/ci/setup_cache.py xcode-present --version "${{ steps.xcode-version.outputs.version }}"; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        if: steps.xcode-present.outputs.installed == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: ${{ steps.xcode-version.outputs.version }}

      - name: Restore cached Xcode archive
        if: steps.xcode-present.outputs.installed != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/Library/Application Support/com.robotsandpencils.xcodes"
          key: orlix-xcode-${{ steps.xcode-version.outputs.version }}-17F113

      - name: Restore Homebrew source bottles
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Orlix/homebrew-bottles
          key: orlix-homebrew-${{ hashFiles('Brewfile') }}-xcodes-2.1.0-6e47b55144cb1d1f5948e0bb6f443b13a8a8efc2

      - name: Install declared build tools
        id: tools
        run: |
          set -euo pipefail
          xcodes_tap_revision=6e47b55144cb1d1f5948e0bb6f443b13a8a8efc2
          brew tap xcodesorg/made
          git -C "$(brew --repo xcodesorg/made)" fetch origin "$xcodes_tap_revision"
          git -C "$(brew --repo xcodesorg/made)" checkout "$xcodes_tap_revision"
          brew trust --formula xcodesorg/made/xcodes
          python3 bazel/ci/setup_cache.py install-bottles --bottle-dir "$HOME/Library/Caches/Orlix/homebrew-bottles"
          brew bundle --file Brewfile
          test "$(git -C "$(brew --repo xcodesorg/made)" rev-parse HEAD)" = "$xcodes_tap_revision"
          test "$(xcodes version)" = "2.1.0"
          python3 bazel/ci/setup_cache.py capture-bottles --bottle-dir "$HOME/Library/Caches/Orlix/homebrew-bottles" --brewfile Brewfile
          if compgen -G "$HOME/Library/Caches/Orlix/homebrew-bottles/*.bottle.tar.gz" > /dev/null; then
            echo "bottles=true" >> "$GITHUB_OUTPUT"
          else
            echo "bottles=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the requested Xcode from the cache or Apple
        if: steps.xcode-present.outputs.installed != 'true'
        run: |
          set -euo pipefail
          xcodes install "${{ steps.xcode-version.outputs.version }}"
          xcodes select --print-path

      - name: Save cached Xcode archive
        if: github.ref == 'refs/heads/main' && steps.xcode-present.outputs.installed != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/Library/Application Support/com.robotsandpencils.xcodes"
          key: orlix-xcode-${{ steps.xcode-version.outputs.version }}-17F113

      - name: Save Homebrew source bottles
        if: github.ref == 'refs/heads/main' && steps.tools.outputs.bottles == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Orlix/homebrew-bottles
          key: orlix-homebrew-${{ hashFiles('Brewfile') }}-xcodes-2.1.0-6e47b55144cb1d1f5948e0bb6f443b13a8a8efc2

      - name: Export the selected Xcode to Make
        run: |
          set -euo pipefail
          echo "ORLIX_PINNED_DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Verify selected Xcode
        run: |
          set -euo pipefail
          python3 bazel/config/xcode_select.py --repo "$GITHUB_WORKSPACE" --build 17F113 --developer-dir "$ORLIX_PINNED_DEVELOPER_DIR"

      - name: Measure and compare component builds through Make
        run: |
          set -euo pipefail
          mkdir -p Build/AgentHarness/bazel-migration
          /usr/bin/time -l make __bazel-cache-equivalence 2>&1 | tee Build/AgentHarness/bazel-migration/benchmark.log
      - name: Store benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bazel-benchmark-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Build/AgentHarness/bazel-migration/benchmark.log
            Build/Bazel/toolchain.json
            Build/Bazel/cache-equivalence.*/comparison.json
            Build/Bazel/cache-equivalence.*/*/build-events.json
            Build/Bazel/cache-equivalence.*/*/profile.json.gz
            Build/Bazel/cache-equivalence.*/*/execution.json
            Build/Bazel/cache-equivalence.*/*/cache-observation.json
          if-no-files-found: error
          retention-days: 14
