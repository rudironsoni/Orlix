name: Bazel component benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "39 4 * * 0"

permissions:
  contents: read

concurrency:
  group: bazel-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Measure clean and cached component builds
    if: github.ref == 'refs/heads/main' && github.repository == 'rudironsoni/Orlix'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.6"
      - name: Export the selected Xcode to Make
        run: |
          set -euo pipefail
          echo "ORLIX_PINNED_DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 17F113"
      - name: Install build tools
        run: |
          brew bundle --file Brewfile
          brew list jq >/dev/null 2>&1 || brew install jq
      - name: Measure and compare component builds through Make
        run: |
          set -euo pipefail
          mkdir -p Build/AgentHarness/bazel-migration
          /usr/bin/time -l make __bazel-cache-equivalence 2>&1 | tee Build/AgentHarness/bazel-migration/benchmark.log
      - name: Store benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bazel-benchmark-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Build/AgentHarness/bazel-migration/benchmark.log
            Build/Bazel/toolchain.json
            Build/Bazel/cache-equivalence.*/comparison.json
            Build/Bazel/cache-equivalence.*/*/build-events.json
            Build/Bazel/cache-equivalence.*/*/profile.json.gz
            Build/Bazel/cache-equivalence.*/*/execution.json
            Build/Bazel/cache-equivalence.*/*/cache-observation.json
          if-no-files-found: error
          retention-days: 14
