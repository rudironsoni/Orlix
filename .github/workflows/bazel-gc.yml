name: Bazel cache garbage collection

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: bazel-gc
  cancel-in-progress: true

jobs:
  gc:
    name: Bound local cache growth
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read requested Xcode version
        id: xcode-version
        run: |
          set -euo pipefail
          test -s .xcode-version
          echo "version=$(tr -d '[:space:]' < .xcode-version)" >> "$GITHUB_OUTPUT"

      - name: See whether the requested Xcode is already on the runner
        id: xcode-present
        run: |
          set -euo pipefail
          if python3 bazel/ci/setup_cache.py xcode-present --version "${{ steps.xcode-version.outputs.version }}" || python3 bazel/ci/setup_cache.py xcode-selected --version "${{ steps.xcode-version.outputs.version }}"; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        if: steps.xcode-present.outputs.installed == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.xcode-version.outputs.version }}

      - name: Install the requested Xcode
        if: steps.xcode-present.outputs.installed != 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.xcode-version.outputs.version }}

      - name: Install declared build tools
        run: |
          set -euo pipefail
          if python3 bazel/ci/setup_cache.py bundle-satisfied --brewfile Brewfile; then
            echo "Homebrew packages are already installed; skipping brew bundle"
          else
            brew bundle --file Brewfile
          fi

      - name: Export the selected Xcode to Make
        run: |
          set -euo pipefail
          echo "ORLIX_PINNED_DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Verify selected Xcode
        run: |
          set -euo pipefail
          python3 bazel/config/xcode_select.py --repo "$GITHUB_WORKSPACE" --build 17F113 --developer-dir "$ORLIX_PINNED_DEVELOPER_DIR"
      - name: Run Make-owned cache GC
        run: make __bazel-gc
