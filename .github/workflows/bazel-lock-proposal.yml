name: Bazel lock proposal

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bazel-lock-proposal
  cancel-in-progress: false

jobs:
  derail-watchdog:
    name: Cancel if derailed
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
    steps:
      - name: Cancel when macos-26 stays queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            job_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "Write lock proposal") | .status' | head -n 1)"
            case "$job_state" in
              in_progress|completed)
                echo "macos-26 job is $job_state"
                exit 0
                ;;
            esac
            sleep 30
          done
          gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
          echo "cancelled: macos-26 job still queued after 10 minutes"
          exit 1

  lock-proposal:
    name: Write lock proposal
    runs-on: macos-26
    environment: bazel-promotion
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        timeout-minutes: 5
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - name: Export the selected Xcode to Make
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "ORLIX_PINNED_DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 17F113"
      - name: Write the signed lock proposal without mutating artifacts.lock.json
        timeout-minutes: 10
        run: make __bazel-lock-proposal
      - name: Store the lock proposal
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildset-lock-proposal-${{ github.sha }}
          path: Build/Bazel/promote/buildset-lock-proposal.json
          if-no-files-found: error
          retention-days: 14
