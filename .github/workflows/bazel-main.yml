name: Bazel main

on:
  push:
    branches: [main]
    paths:
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "bazel/**"
      - "make/bazel-migration.mk"
      - "artifacts.lock.json"
      - ".github/workflows/bazel-pr.yml"
      - ".github/workflows/bazel-promote.yml"
      - ".github/workflows/bazel-gc.yml"
      - ".github/workflows/bazel-main.yml"
      - ".github/workflows/bazel-nightly.yml"

permissions:
  contents: read

concurrency:
  group: bazel-main-${{ github.sha }}
  cancel-in-progress: true

jobs:
  matrix-check:
    name: Bazel matrix check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - name: Run Make-owned Bazel matrix check
        run: make __bazel-matrix-check
