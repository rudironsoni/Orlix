name: Bazel pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bazel-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix-check:
    name: Bazel matrix check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - name: Install declared build tools
        run: brew bundle --file Brewfile
      - name: Export the selected Xcode to Make
        run: |
          set -euo pipefail
          echo "ORLIX_PINNED_DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 17F113"
      - name: Run Make-owned Bazel matrix check
        run: make __bazel-matrix-check
