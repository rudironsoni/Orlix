name: Bazel promote

on:
  workflow_dispatch:
    inputs:
      component:
        description: Private component to dual-build and compare
        required: true
        type: choice
        options:
          - uapi
          - mlibc
          - rootfs

permissions:
  contents: read
  actions: write

concurrency:
  group: bazel-promote-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  derail-watchdog:
    name: Cancel if derailed
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
    steps:
      - name: Cancel when macos-26 stays queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            job_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "Dual-build promote") | .status' | head -n 1)"
            case "$job_status" in
              in_progress|completed)
                echo "macos-26 job is $job_status"
                exit 0
                ;;
            esac
            sleep 30
          done
          gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
          echo "cancelled: macos-26 job still queued after 10 minutes"
          exit 1

  promote:
    name: Dual-build promote
    runs-on: macos-26
    environment: bazel-promotion
    timeout-minutes: 360
    steps:
      - name: Check out the exact commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        timeout-minutes: 5
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - name: Export the selected Xcode to Make
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "ORLIX_PINNED_DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 17F113"
      - name: Dual-build without action cache
        timeout-minutes: 350
        env:
          ORLIX_COSIGN_KEY: ${{ secrets.ORLIX_COSIGN_KEY }}
        run: make __bazel-promote-${{ inputs.component }}
