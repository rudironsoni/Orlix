name: Bazel promote

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: bazel-promote-buildset
  cancel-in-progress: false

jobs:
  derail-watchdog:
    name: Cancel if derailed
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
    steps:
      - name: Cancel when macos-26 stays queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            job_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "Dual-build promote") | .status' | head -n 1)"
            case "$job_status" in
              in_progress|completed)
                echo "macos-26 job is $job_status"
                exit 0
                ;;
            esac
            sleep 30
          done
          gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
          echo "cancelled: macos-26 job still queued after 10 minutes"
          exit 1

  promote:
    name: Dual-build promote
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'rudironsoni/Orlix' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/build-optimizations')
    runs-on: macos-26
    permissions:
      contents: read
      packages: write
    environment: bazel-promotion
    timeout-minutes: 360
    steps:
      - name: Check out the exact commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read requested Xcode version
        id: xcode-version
        run: |
          set -euo pipefail
          test -s .xcode-version
          echo "version=$(tr -d '[:space:]' < .xcode-version)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        timeout-minutes: 5
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.xcode-version.outputs.version }}

      - name: Restore verified source downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/Orlix/Bazel/repository-cache
          key: orlix-bazel-repos-${{ hashFiles('MODULE.bazel.lock', 'bazel/extensions/ghostty_zig_packages.json') }}
          restore-keys: |
            orlix-bazel-repos-

      - name: Install declared build tools
        run: brew bundle --file Brewfile


      - name: Export the selected Xcode to Make
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "ORLIX_PINNED_DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          echo "ORLIX_BAZEL_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Verify selected Xcode
        run: |
          set -euo pipefail
          python3 bazel/config/xcode_select.py --repo "$GITHUB_WORKSPACE" --build 17F113 --developer-dir "$ORLIX_PINNED_DEVELOPER_DIR"

      - name: Dual-build without action cache
        timeout-minutes: 350
        run: make __bazel-promote-buildset

      - name: Sign and publish the buildset to GHCR
        timeout-minutes: 40
        env:
          ORLIX_COSIGN_KEY: ${{ secrets.ORLIX_COSIGN_KEY }}
          ORLIX_COSIGN_KEY_PASSWORD: ${{ secrets.ORLIX_COSIGN_KEY_PASSWORD }}
          ORLIX_ORAS_REGISTRY_CONFIG: ${{ runner.temp }}/orlix-registry.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORLIX_COSIGN_KEY}" ]; then
            echo "ORLIX_COSIGN_KEY is required; promotion failed"
            exit 1
          fi
          brew list cosign >/dev/null 2>&1 || brew install cosign
          brew list oras >/dev/null 2>&1 || brew install oras
          key_path="${ORLIX_COSIGN_KEY#file://}"
          if [ ! -f "$key_path" ]; then
            key_path="${RUNNER_TEMP}/orlix-cosign.key"
            printf '%s\n' "$ORLIX_COSIGN_KEY" > "$key_path"
            chmod 600 "$key_path"
          fi
          export ORLIX_COSIGN_KEY="file://${key_path}"
          export COSIGN_PASSWORD="${ORLIX_COSIGN_KEY_PASSWORD}"
          cosign public-key --key "$key_path" > "$key_path.pub"
          export ORLIX_COSIGN_PUB="$key_path.pub"
          printf '%s\n' "$GITHUB_TOKEN" | oras login ghcr.io --registry-config "$ORLIX_ORAS_REGISTRY_CONFIG" -u "${GITHUB_ACTOR}" --password-stdin
          for component in $(python3 bazel/promotion/components.py --names); do
            make "__bazel-publish-${component}"
          done
          make __bazel-lock-proposal

      - name: Save verified source downloads
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/Orlix/Bazel/repository-cache
          key: orlix-bazel-repos-${{ hashFiles('MODULE.bazel.lock', 'bazel/extensions/ghostty_zig_packages.json') }}

      - name: Store the verified signed buildset proposal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-buildset-${{ github.sha }}
          path: |
            Build/Bazel/promote/uapi/uapi-signed.json
            Build/Bazel/promote/uapi/uapi-sbom.json
            Build/Bazel/promote/uapi/uapi-in-toto.json
            Build/Bazel/promote/mlibc/mlibc-signed.json
            Build/Bazel/promote/mlibc/mlibc-sbom.json
            Build/Bazel/promote/mlibc/mlibc-in-toto.json
            Build/Bazel/promote/rootfs/rootfs-signed.json
            Build/Bazel/promote/rootfs/rootfs-sbom.json
            Build/Bazel/promote/rootfs/rootfs-in-toto.json
            Build/Bazel/promote/kernel-release-iphoneos/kernel-release-iphoneos-signed.json
            Build/Bazel/promote/kernel-release-iphoneos/kernel-release-iphoneos-sbom.json
            Build/Bazel/promote/kernel-release-iphoneos/kernel-release-iphoneos-in-toto.json
            Build/Bazel/promote/kernel-release-iphonesimulator/kernel-release-iphonesimulator-signed.json
            Build/Bazel/promote/kernel-release-iphonesimulator/kernel-release-iphonesimulator-sbom.json
            Build/Bazel/promote/kernel-release-iphonesimulator/kernel-release-iphonesimulator-in-toto.json
            Build/Bazel/promote/kernel-development-iphoneos/kernel-development-iphoneos-signed.json
            Build/Bazel/promote/kernel-development-iphoneos/kernel-development-iphoneos-sbom.json
            Build/Bazel/promote/kernel-development-iphoneos/kernel-development-iphoneos-in-toto.json
            Build/Bazel/promote/kernel-development-iphonesimulator/kernel-development-iphonesimulator-signed.json
            Build/Bazel/promote/kernel-development-iphonesimulator/kernel-development-iphonesimulator-sbom.json
            Build/Bazel/promote/kernel-development-iphonesimulator/kernel-development-iphonesimulator-in-toto.json
            Build/Bazel/promote/toolchain-manifest.json
            Build/Bazel/promote/promotion-proof-index.json
            Build/Bazel/promote/buildset-lock-proposal.json
            Build/Bazel/promote/buildset-lock-proposal.sigstore.json
          if-no-files-found: error
          retention-days: 14
