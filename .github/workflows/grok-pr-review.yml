name: Grok PR Review

# Disabled 2026-08-28: this workflow was failing. Keep the file; do not run
# it on pull requests until GROK_AUTH_JSON / grok-build-review-action is
# stable. Restore the pull_request trigger below to re-enable.
on:
  workflow_dispatch:

# on:
#   pull_request:
#     types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: grok-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      ${{ !github.event.pull_request.draft
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      HAS_GROK_AUTH: ${{ secrets.GROK_AUTH_JSON != '' }}
    steps:
      - name: Skip when GROK_AUTH_JSON is unset
        if: ${{ env.HAS_GROK_AUTH != 'true' }}
        run: echo "GROK_AUTH_JSON is unset; skipping Grok review."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.HAS_GROK_AUTH == 'true' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Restore trusted reviewer policy from the base revision
        if: ${{ env.HAS_GROK_AUTH == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth 1 origin "$BASE_SHA"
          git checkout "$BASE_SHA" -- AGENTS.md CLAUDE.md

      - uses: 0xr3ngar/grok-build-review-action@eded30018cdee4e83dfca14d18f292b860c30cdd # v1.0.2
        if: ${{ env.HAS_GROK_AUTH == 'true' }}
        with:
          grok_auth_json: ${{ secrets.GROK_AUTH_JSON }}
          roast_level: professional
          custom_instructions: |
            Follow AGENTS.md from the pull request base revision. Orlix compiles
            upstream Linux into an iOS-hosted kernel. Do not suggest edits to
            generated trees under Build/. Do not move Linux policy into
            OrlixHostAdapter. Do not invent a parallel OrlixKit API. Fail loud
            when evidence is missing.
