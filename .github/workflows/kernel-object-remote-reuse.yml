name: Kernel object remote reuse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kernel-object-remote-reuse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  producer:
    name: Publish kernel compiler objects
    cache-mode: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rudironsoni/Orlix'
    runs-on: macos-26
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the macOS kernel runner
        uses: ./.github/actions/macos-kernel-setup

      - name: Copy compiler-object cache credentials
        uses: ./bazel/ci/compiler_object_cache_env

      - name: Build the Orlix kernel archive and publish compiler objects
        env:
          ORLIX_KERNEL_OBJECT_REMOTE_MODE: produce
          ORLIX_COMPILER_OBJECT_REMOTE_WRITE: "1"
        run: make __kernel-object-remote-reuse

      - name: Stage the publication marker
        run: |
          set -euo pipefail
          mkdir -p Build/kernel-object-remote-publication
          cp Build/kernel-object-remote-reuse/evidence.json Build/kernel-object-remote-publication/evidence.json

      - name: Publish the kernel compiler-object marker
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Build/kernel-object-remote-publication
          key: orlix-kernel-compiler-object-publication-v1-${{ github.sha }}

  same-commit:
    name: Reuse unchanged kernel compiler objects
    cache-mode: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rudironsoni/Orlix'
    needs: producer
    runs-on: macos-26
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the main publication
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Build/kernel-object-remote-publication
          key: orlix-kernel-compiler-object-publication-v1-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Prepare the macOS kernel runner
        uses: ./.github/actions/macos-kernel-setup

      - name: Copy compiler-object cache credentials
        uses: ./bazel/ci/compiler_object_cache_env

      - name: Rebuild the same commit without compiler-object write
        env:
          ORLIX_KERNEL_OBJECT_REMOTE_MODE: reuse
          ORLIX_KERNEL_OBJECT_REMOTE_PRODUCER: Build/kernel-object-remote-publication/evidence.json
        run: make __kernel-object-remote-reuse

  mutation:
    name: Reuse kernel objects after commit B
    cache-mode: read
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out commit B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require the main publication
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Build/kernel-object-remote-publication
          key: orlix-kernel-compiler-object-publication-v1-${{ github.event.pull_request.base.sha }}
          fail-on-cache-miss: true

      - name: Prepare the macOS kernel runner
        uses: ./.github/actions/macos-kernel-setup

      - name: Copy compiler-object cache credentials
        uses: ./bazel/ci/compiler_object_cache_env

      - name: Build commit B without compiler-object write
        env:
          ORLIX_KERNEL_OBJECT_REMOTE_MODE: mutate
          ORLIX_KERNEL_OBJECT_REMOTE_PRODUCER: Build/kernel-object-remote-publication/evidence.json
        run: make __kernel-object-remote-reuse
