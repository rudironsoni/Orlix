name: Kernel object remote reuse

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: kernel-object-remote-reuse-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install the kernel build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache xz-utils strace build-essential flex bison bc libelf-dev libssl-dev
      - name: Produce compiler objects
        env:
          ORLIX_KERNEL_OBJECT_REMOTE_MODE: produce
          ORLIX_COMPILER_OBJECT_REMOTE_WRITE: "1"
        run: make __kernel-object-remote-reuse
      - name: Upload object identities
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-object-identities
          path: Build/kernel-object-remote-reuse/evidence.json
          if-no-files-found: error

  reuse:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install the kernel build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache xz-utils strace build-essential flex bison bc libelf-dev libssl-dev
      - name: Download producer identities
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-object-identities
          path: Build/kernel-object-remote-reuse/producer
      - name: Reuse unchanged compiler objects
        env:
          ORLIX_KERNEL_OBJECT_REMOTE_MODE: reuse
        run: make __kernel-object-remote-reuse

  mutate:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install the kernel build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache xz-utils strace build-essential flex bison bc libelf-dev libssl-dev
      - name: Download producer identities
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-object-identities
          path: Build/kernel-object-remote-reuse/producer
      - name: Compile the mutated unit and reuse the rest
        env:
          ORLIX_KERNEL_OBJECT_REMOTE_MODE: mutate
        run: make __kernel-object-remote-reuse
