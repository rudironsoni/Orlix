name: RuleSync main generation

on:
  push:
    branches:
      - main
    paths:
      - '.rulesync/**'
      - 'rulesync.jsonc'

permissions:
  contents: read

concurrency:
  group: rulesync-main-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Create RuleSync App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.ORLIX_RULESYNC_APP_ID }}
          private-key: ${{ secrets.ORLIX_RULESYNC_APP_PRIVATE_KEY }}
          owner: rudironsoni
          repositories: Orlix
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          token: ${{ steps.app-token.outputs.token }}
      - name: Verify RuleSync App identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          test "$APP_SLUG" = "orlix-rulesync-generator"
          test -n "$INSTALLATION_ID"
          printf "Authenticated App: %s\nInstallation ID: %s\n" "$APP_SLUG" "$INSTALLATION_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned RuleSync
        run: |
          version="$(tr -d '[:space:]' < .rulesync/VERSION)"
          curl -fsSL "https://github.com/dyoshikawa/rulesync/releases/download/v${version}/rulesync-linux-x64" -o "$RUNNER_TEMP/rulesync"
          printf '%s  %s\n' a31f7861d70a1092748108a7b494c0f7c845166e7495b51b7e032a200bf07dea "$RUNNER_TEMP/rulesync" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/rulesync"
          test "$("$RUNNER_TEMP/rulesync" --version)" = "$version"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate source
        run: rulesync doctor
      - name: Generate client configuration
        run: rulesync generate
      - name: Validate generator write set
        run: make agent-rules-validate-write-set
      - name: Commit generated output
        run: |
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          version="$(tr -d '[:space:]' < .rulesync/VERSION)"
          git config user.name "RuleSync CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate agent files" -m "source-revision: ${GITHUB_SHA}" -m "rulesync-version: ${version}"
          git push origin HEAD:main
