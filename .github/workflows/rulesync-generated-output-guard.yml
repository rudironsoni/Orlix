name: RuleSync generated output guard

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      source_revision:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  guard:
    name: RuleSync generated output guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned RuleSync
        run: |
          version="$(tr -d '[:space:]' < .rulesync/VERSION)"
          curl -fsSL "https://github.com/dyoshikawa/rulesync/releases/download/v${version}/rulesync-linux-x64" -o "$RUNNER_TEMP/rulesync"
          printf '%s  %s\n' a31f7861d70a1092748108a7b494c0f7c845166e7495b51b7e032a200bf07dea "$RUNNER_TEMP/rulesync" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/rulesync"
          test "$("$RUNNER_TEMP/rulesync" --version)" = "$version"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate invocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            exit 0
          fi
          test "$MODE" = "generated"
      - name: Reject generated changes
        if: github.event_name == 'pull_request'
        run: make agent-rules-pr-guard BASE="${{ github.event.pull_request.base.sha }}" HEAD="${{ github.event.pull_request.head.sha }}"
      - name: Verify generated pull request
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'generated'
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          head_sha="$(gh pr view "$PR_NUMBER" --repo rudironsoni/Orlix --json headRefOid --jq .headRefOid)"
          git fetch origin "$head_sha"
          make agent-rules-generated-pr-check PR_NUMBER="$PR_NUMBER" SOURCE_REVISION="$SOURCE_REVISION" HEAD_REVISION="$head_sha"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Publish verified status
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'generated'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.verified.outputs.head_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="RuleSync generated output guard" \
            -f description="Exact RuleSync regeneration matched" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
