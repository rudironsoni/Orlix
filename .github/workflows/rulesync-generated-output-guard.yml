name: RuleSync generated output guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ startsWith(github.head_ref, 'automation/rulesync-') && 'rulesync-main-generation' || format('rulesync-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  guard:
    name: RuleSync generated output guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned RuleSync
        run: |
          version="$(tr -d '[:space:]' < .rulesync/VERSION)"
          curl -fsSL "https://github.com/dyoshikawa/rulesync/releases/download/v${version}/rulesync-linux-x64" -o "$RUNNER_TEMP/rulesync"
          printf '%s  %s\n' a31f7861d70a1092748108a7b494c0f7c845166e7495b51b7e032a200bf07dea "$RUNNER_TEMP/rulesync" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/rulesync"
          test "$("$RUNNER_TEMP/rulesync" --version)" = "$version"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check generated changes
        id: generated-changes
        continue-on-error: true
        run: make agent-rules-pr-guard BASE="${{ github.event.pull_request.base.sha }}" HEAD="${{ github.event.pull_request.head.sha }}"
      - name: Accept trusted generated status
        if: steps.generated-changes.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make agent-rules-generated-status-check PR_NUMBER="${{ github.event.pull_request.number }}" HEAD_REVISION="${{ github.event.pull_request.head.sha }}"
