name: Orlix
options:
  bundleIdPrefix: com.rudironsoni
  deploymentTarget:
    iOS: "16.1"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: OrlixOS/Sources/distribution/target-settings.xcconfig
  Release: OrlixOS/Sources/distribution/target-settings.xcconfig
settings:
  base:
    ARCHS[sdk=iphonesimulator*]: arm64
    CLANG_ENABLE_MODULES: YES
    CURRENT_PROJECT_VERSION: 42
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS:
      - $(inherited)
      - ORLIX_BETA_OBSERVABILITY
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - DEBUG=1
        - ORLIX_APP_HOSTED_BOOT=1
        - ORLIX_BETA_OBSERVABILITY=1
      SWIFT_ACTIVE_COMPILATION_CONDITIONS:
        - $(inherited)
        - DEBUG
        - ORLIX_BETA_OBSERVABILITY
    Release:
      GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - ORLIX_APP_HOSTED_BOOT=1
        - ORLIX_BETA_OBSERVABILITY=1
packages:
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    revision: 072b684acaae80b6a463abab3a103732f33774bf
  SwiftCloudflared:
    url: https://github.com/wiedymi/swift-cloudflared.git
    revision: 1be78afe5dae7a20ce0837ce34085f03a77f7587
  SwiftMosh:
    url: https://github.com/wiedymi/swift-mosh
    revision: 9677768702727ba9094d4936062a452b9c544480
  SwiftET:
    url: https://github.com/wiedymi/swift-et
    revision: 2e43ccd70cd74cd46e18a92d20a0ea7547ba42ed
  SwiftNumerics:
    url: https://github.com/apple/swift-numerics
    revision: 0c0290ff6b24942dadb83a929ffaaa1481df04a2
  TweetNaclSwiftwrap:
    url: https://github.com/bitmark-inc/tweetnacl-swiftwrap.git
    revision: f8fd111642bf2336b11ef9ea828510693106e954
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    revision: edbeaa39b426e54702194b0a601342322f01e400
  OpenTelemetrySwift:
    url: https://github.com/open-telemetry/opentelemetry-swift.git
    revision: 9a6d6a8aed22c415bb1673206e337824635f818b
  OpenTelemetrySwiftCore:
    url: https://github.com/open-telemetry/opentelemetry-swift-core.git
    revision: 06f8a460a66f813758d22f09025d85df45450a63
targets:
  OrlixKernel:
    type: framework.static
    platform: iOS
    sources:
      - path: OrlixKernel/Sources/boot
        createIntermediateGroups: true
        includes:
          - "*.c"
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/boot
        createIntermediateGroups: true
        includes:
          - "*.c"
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/terminal
        createIntermediateGroups: true
        includes:
          - "*.c"
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/memory
        createIntermediateGroups: true
        includes:
          - "*.c"
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/observability
        createIntermediateGroups: true
        includes:
          - "*.c"
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/execution
        createIntermediateGroups: true
        includes:
          - "*.c"
      - path: OrlixKernel/Sources/include
        createIntermediateGroups: true
        buildPhase: headers
        headerVisibility: public
      - path: OrlixKernel/Sources/Support
        createIntermediateGroups: true
        buildPhase: none
      - path: OrlixKernel/Sources/ports
        createIntermediateGroups: true
        buildPhase: none
    dependencies:
      - sdk: CoreFoundation.framework
    preBuildScripts:
      - name: Build OrlixKernel Archive
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          profile="${ORLIX_PROFILE:-release}"
          platform="${PLATFORM_NAME:?}"
          build_root="${ORLIX_BUILD_ROOT:-$SRCROOT/Build}"
          case "$platform" in
              iphoneos|iphonesimulator) ;;
              *) echo "unsupported OrlixKernel archive platform: $platform" >&2; exit 1 ;;
          esac
          "${MAKE:-make}" -f "$SRCROOT/OrlixKernel/Makefile" __kernel-archive PROFILE="$profile" ORLIX_BUILD_ROOT="$build_root" ORLIX_KERNEL_ARCHIVE_PLATFORMS="$platform"
          archive="$build_root/OrlixKernel/$profile/$platform/OrlixKernel.a"
          if [ ! -s "$archive" ]; then
              echo "missing OrlixKernel archive: $archive" >&2
              exit 1
          fi
          mkdir -p "$TARGET_TEMP_DIR"
          if [ ! -s "$TARGET_TEMP_DIR/OrlixKernel.a" ] || ! cmp -s "$archive" "$TARGET_TEMP_DIR/OrlixKernel.a"; then
              cp -f "$archive" "$TARGET_TEMP_DIR/OrlixKernel.a"
          else
              echo "Reusing unchanged OrlixKernel archive."
          fi
    settings:
      base:
        CLANG_ENABLE_MODULE_VERIFIER: YES
        DEFINES_MODULE: YES
        INFOPLIST_FILE: OrlixKernel/Sources/Support/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.orlix.os.kernel
        PRODUCT_NAME: OrlixKernel
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/OrlixKernel/Sources
          - $(SRCROOT)/OrlixKernel/Sources/include
          # Temporary arch boot seam include only. Do not add generic Linux
          # or generated Kbuild include roots to Xcode targets.
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/overlay/arch/orlix/include
          - $(SRCROOT)/OrlixHostAdapter/Sources
        OTHER_LIBTOOLFLAGS:
          - $(inherited)
          - $(TARGET_TEMP_DIR)/OrlixKernel.a
        ARCHS[sdk=iphonesimulator*]: arm64
      GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - ORLIX_APP_HOSTED_BOOT=1
        - ORLIX_BETA_OBSERVABILITY=1
  OrlixMLibC:
    type: framework.static
    platform: iOS
    sources:
      - path: OrlixMLibC/Sources/Provider
        createIntermediateGroups: true
        excludes:
          - Info.plist
      - path: OrlixMLibC/Sources/patches
        createIntermediateGroups: true
        buildPhase: none
    dependencies:
      - target: OrlixKernel
        link: false
    preBuildScripts:
      - name: Build OrlixMLibC Linux Sysroot
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          profile="${ORLIX_PROFILE:-release}"
          build_root="${ORLIX_BUILD_ROOT:-$SRCROOT/Build}"
          "${MAKE:-make}" -f "$SRCROOT/OrlixMLibC/Makefile" build PROFILE="$profile" ORLIX_BUILD_ROOT="$build_root"
    settings:
      base:
        DEFINES_MODULE: NO
        INFOPLIST_FILE: OrlixMLibC/Sources/Provider/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.orlix.os.mlibc
        PRODUCT_NAME: OrlixMLibC
        SKIP_INSTALL: YES
  OrlixCoreUtils:
    type: framework.static
    platform: iOS
    sources:
      - path: OrlixCoreUtils/Sources/Provider
        createIntermediateGroups: true
        excludes:
          - Info.plist
      - path: OrlixCoreUtils/Sources/Programs
        createIntermediateGroups: true
        buildPhase: none
      - path: OrlixCoreUtils/Sources/make
        createIntermediateGroups: true
        buildPhase: none
    dependencies:
      - target: OrlixMLibC
        link: false
    preBuildScripts:
      - name: Build OrlixCoreUtils Linux Payload
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          profile="${ORLIX_PROFILE:-release}"
          build_root="${ORLIX_BUILD_ROOT:-$SRCROOT/Build}"
          "${MAKE:-make}" -f "$SRCROOT/OrlixCoreUtils/Makefile" build PROFILE="$profile" ORLIX_BUILD_ROOT="$build_root"
    settings:
      base:
        DEFINES_MODULE: NO
        INFOPLIST_FILE: OrlixCoreUtils/Sources/Provider/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.orlix.os.coreutils
        PRODUCT_NAME: OrlixCoreUtils
        SKIP_INSTALL: YES
  OrlixOS:
    type: framework
    platform: iOS
    sources:
      - path: OrlixOS/Sources/Session
        createIntermediateGroups: true
      - path: OrlixOS/Sources/init
        createIntermediateGroups: true
        buildPhase: none
      - path: OrlixOS/Sources/make
        createIntermediateGroups: true
        buildPhase: none
      - path: OrlixOS/Sources/include
        createIntermediateGroups: true
        buildPhase: none
      - path: OrlixOS/Sources/patches
        createIntermediateGroups: true
        buildPhase: none
    dependencies:
      - target: OrlixKernel
        link: true
      - target: OrlixMLibC
        link: true
      - target: OrlixCoreUtils
        link: true
      - sdk: libz.tbd
    postBuildScripts:
      - name: Embed OrlixOS Resources
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/OrlixOS/Makefile
          - $(SRCROOT)/OrlixCoreUtils/Makefile
          - $(SRCROOT)/OrlixCoreUtils/Sources/make/config.mk
          - $(SRCROOT)/OrlixOS/Sources/distribution/target-settings.xcconfig
          - $(SRCROOT)/OrlixOS/Sources/init
          - $(SRCROOT)/OrlixOS/Sources/make
          - $(SRCROOT)/OrlixOS/Sources/make/rules.mk
          - $(SRCROOT)/OrlixKernel/Makefile
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/configs
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/kbuild/kernel-rules.mk
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/kbuild/product-compile-adapter.mk
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/overlay
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/patches
          - $(SRCROOT)/OrlixOS/Makefile
          - $(SRCROOT)/OrlixOS/Sources/make/payload.mk
          - $(SRCROOT)/OrlixOS/Sources/distribution/manifest.mk
          - $(SRCROOT)/OrlixOS/Sources/init/init.c
          - $(SRCROOT)/OrlixOS/Sources/init/console_policy.c
          - $(SRCROOT)/OrlixOS/Sources/init/console_policy.h
          - $(SRCROOT)/OrlixOS/Sources/init/terminal_mux.c
          - $(SRCROOT)/OrlixOS/Sources/init/terminal_mux.h
          - $(SRCROOT)/OrlixOS/Sources/init/rootinit.c
          - $(SRCROOT)/OrlixOS/Sources/make/config.mk
          - $(SRCROOT)/OrlixOS/Sources/make/packages.mk
          - $(SRCROOT)/OrlixOS/Sources/make/rootfs.mk
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/OrlixOSManifest.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/.orlix-payload-ready
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/rootfs
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/rootfs/initramfs.cpio.gz
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/rootfs/base.ext4
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/rootfs/state.ext4
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/arch
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/arch/orlix
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/arch/orlix/boot
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/arch/orlix/boot/dts
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/arch/orlix/boot/dts/development.dtb
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/arch/orlix/boot/dts/release.dtb
        script: |
          set -eu
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          build_root="${ORLIX_BUILD_ROOT:-$SRCROOT/Build}"
          ORLIX_BUILD_ROOT="$build_root"
          if [ "${ORLIX_OS_SKIP_PAYLOAD_EMBED:-NO}" = YES ]; then
              echo "Skipping OrlixOS payload embed because ORLIX_OS_SKIP_PAYLOAD_EMBED=YES"
              exit 0
          fi
          profile="${ORLIX_PROFILE:-release}"
          ORLIX_OS_PAYLOAD_SOURCE_ROOT="$ORLIX_BUILD_ROOT/OrlixKernel/resource-staging"
          ORLIX_OS_ROOT_INITRAMFS_INPUT="$ORLIX_BUILD_ROOT/OrlixOS/rootfs/$profile/rootfs/initramfs.cpio.gz"
          ORLIX_OS_BASE_ROOT_TREE_INPUT="$ORLIX_BUILD_ROOT/OrlixOS/rootfs/$profile/base-tree"
          ORLIX_OS_STATE_ROOT_TREE_INPUT="$ORLIX_BUILD_ROOT/OrlixOS/rootfs/$profile/state-tree"
          payload="$ORLIX_OS_PAYLOAD_SOURCE_ROOT/$profile"
          if [ "${ORLIX_OS_EXPECTED_ROOTFS_INPUT+x}" = x ]; then
              expected_rootfs_input="$ORLIX_OS_EXPECTED_ROOTFS_INPUT"
          else
              expected_rootfs_input="$ORLIX_OS_ROOT_INITRAMFS_INPUT"
          fi
          if [ "${ORLIX_OS_EXPECTED_BASE_ROOT_TREE_INPUT+x}" = x ]; then
              expected_base_root_tree_input="$ORLIX_OS_EXPECTED_BASE_ROOT_TREE_INPUT"
          else
              expected_base_root_tree_input="$ORLIX_OS_BASE_ROOT_TREE_INPUT"
          fi
          if [ "${ORLIX_OS_EXPECTED_STATE_ROOT_TREE_INPUT+x}" = x ]; then
              expected_state_root_tree_input="$ORLIX_OS_EXPECTED_STATE_ROOT_TREE_INPUT"
          else
              expected_state_root_tree_input="$ORLIX_OS_STATE_ROOT_TREE_INPUT"
          fi
          stamp="$payload/.orlix-payload-ready"
          payload_needs_rebuild=0
          if [ ! -d "$payload" ] || [ ! -s "$stamp" ]; then
              payload_needs_rebuild=1
          else
              rootfs_input="$(sed -n 's/^rootfs_input=//p' "$stamp")"
              base_root_tree_input="$(sed -n 's/^base_root_tree_input=//p' "$stamp")"
              state_root_tree_input="$(sed -n 's/^state_root_tree_input=//p' "$stamp")"
              if [ "$rootfs_input" != "$expected_rootfs_input" ] ||
                 { [ -n "$expected_base_root_tree_input" ] && [ "$base_root_tree_input" != "$expected_base_root_tree_input" ]; } ||
                 { [ -n "$expected_state_root_tree_input" ] && [ "$state_root_tree_input" != "$expected_state_root_tree_input" ]; }; then
                  payload_needs_rebuild=1
              fi
          fi
          if [ "$payload_needs_rebuild" = 1 ]; then
              "${MAKE:-make}" -f "$SRCROOT/OrlixOS/Makefile" kernel-payload PROFILE="$profile" ORLIX_BUILD_ROOT="$ORLIX_BUILD_ROOT"
          else
            payload_inputs="
              $SRCROOT/OrlixOS/Makefile
              $SRCROOT/OrlixOS/Sources/distribution/manifest.mk
              $SRCROOT/OrlixOS/Sources/distribution/target-settings.xcconfig
              $SRCROOT/OrlixOS/Sources/init/init.c
              $SRCROOT/OrlixOS/Sources/init/console_policy.c
              $SRCROOT/OrlixOS/Sources/init/console_policy.h
            $SRCROOT/OrlixOS/Sources/init/rootinit.c
            $SRCROOT/OrlixOS/Sources/make/config.mk
            $SRCROOT/OrlixOS/Sources/make/packages.mk
            $SRCROOT/OrlixOS/Sources/make/rootfs.mk
            $SRCROOT/OrlixKernel/Makefile
            $SRCROOT/OrlixKernel/Sources/ports/orlix/configs
            $SRCROOT/OrlixKernel/Sources/ports/orlix/kbuild/kernel-rules.mk
            $SRCROOT/OrlixKernel/Sources/ports/orlix/kbuild/product-compile-adapter.mk
            $SRCROOT/OrlixKernel/Sources/ports/orlix/overlay
            $SRCROOT/OrlixKernel/Sources/ports/orlix/patches
                        "
              for payload_input in $payload_inputs; do
                  if [ -e "$payload_input" ] && [ "$payload_input" -nt "$stamp" ]; then
                      payload_needs_rebuild=1
                      break
                  fi
              done
              if [ "$payload_needs_rebuild" = 1 ]; then
              "${MAKE:-make}" -f "$SRCROOT/OrlixOS/Makefile" kernel-payload PROFILE="$profile" ORLIX_BUILD_ROOT="$ORLIX_BUILD_ROOT"
              fi
          fi
          if [ ! -d "$payload" ]; then
              echo "missing staged OrlixOS resources after packaging: $payload" >&2
              exit 1
          fi
          if [ ! -s "$stamp" ]; then
              echo "missing OrlixOS payload stamp after packaging: $stamp" >&2
              exit 1
          fi
          rootfs_input="$(sed -n 's/^rootfs_input=//p' "$stamp")"
          base_root_tree_input="$(sed -n 's/^base_root_tree_input=//p' "$stamp")"
          state_root_tree_input="$(sed -n 's/^state_root_tree_input=//p' "$stamp")"
          case "$rootfs_input" in
              "$expected_rootfs_input") ;;
              *)
                  echo "OrlixOS payload is not packaged from the expected rootfs: $rootfs_input" >&2
                  echo "expected: $expected_rootfs_input" >&2
                  exit 1
                  ;;
          esac
          if [ -n "$expected_base_root_tree_input" ]; then
              case "$base_root_tree_input" in
                  "$expected_base_root_tree_input") ;;
                  *)
                      echo "OrlixOS payload is missing the expected base root tree: $base_root_tree_input" >&2
                      echo "expected: $expected_base_root_tree_input" >&2
                      exit 1
                      ;;
              esac
          fi
          if [ -n "$expected_state_root_tree_input" ]; then
              case "$state_root_tree_input" in
                  "$expected_state_root_tree_input") ;;
                  *)
                      echo "OrlixOS payload is missing the expected state root tree: $state_root_tree_input" >&2
                      echo "expected: $expected_state_root_tree_input" >&2
                      exit 1
                      ;;
              esac
          fi
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          "${MAKE:-make}" -f "$SRCROOT/OrlixOS/Makefile" __sync-payload ORLIX_PAYLOAD_SOURCE="$payload" ORLIX_PAYLOAD_DESTINATION="$destination"
    settings:
      base:
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        CLANG_ENABLE_MODULE_VERIFIER: YES
        DEFINES_MODULE: YES
        INFOPLIST_FILE: OrlixOS/Sources/Session/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.orlix.os
        PRODUCT_NAME: OrlixOS
        SKIP_INSTALL: NO
  OrlixOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrlixOS/Tests/XCTest/OrlixOSTests
        createIntermediateGroups: true
      - path: OrlixOS/Tests/ConsolePolicy
        createIntermediateGroups: true
        buildPhase: none
      - path: OrlixOS/Tests/TerminalMux
        createIntermediateGroups: true
        buildPhase: none
    dependencies:
      - target: OrlixOSTestApp
      - target: OrlixOS
      - sdk: libz.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.orlix.os.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrlixOSTestApp.app/OrlixOSTestApp
        BUNDLE_LOADER: $(TEST_HOST)
  Orlix: &orlix_application_target
    type: application
    platform: iOS
    sources:
      - path: Orlix/Orlix/App
        createIntermediateGroups: true
      - path: Orlix/Orlix/Core
        createIntermediateGroups: true
      - path: Orlix/Orlix/Features
        createIntermediateGroups: true
      - path: Orlix/OrlixShared
        createIntermediateGroups: true
      - path: Orlix/Orlix/Core/Analytics/OrlixTelemetry.swift
        createIntermediateGroups: true
      - path: Orlix/Orlix/Assets.xcassets
        createIntermediateGroups: true
        buildPhase: resources
      - path: Orlix/Orlix/Resources
        createIntermediateGroups: true
        buildPhase: resources
        excludes:
          - Assets.xcassets
          - ghostty
          - terminfo
      - path: Orlix/Orlix/Resources/Assets.xcassets
        createIntermediateGroups: true
        buildPhase: resources
      - path: Orlix/Orlix/Resources/ghostty
        createIntermediateGroups: true
        buildPhase: resources
        type: folder
      - path: Orlix/Orlix/Resources/terminfo
        createIntermediateGroups: true
        buildPhase: resources
        type: folder
      - path: Orlix/Orlix/PrivacyInfo.xcprivacy
        createIntermediateGroups: true
        buildPhase: resources
      - path: docs/sources/release/orlix-app-release-inputs.json
        createIntermediateGroups: true
        buildPhase: resources
    dependencies:
      - target: OrlixOS
        embed: true
      - target: OrlixLiveActivity
        embed: true
      - target: OrlixPacketTunnel
        embed: true
      - framework: Orlix/Vendor/trzsz-ssh/TrzszSSH.xcframework
        embed: false
      - package: MLXSwift
        products:
          - MLX
          - MLXNN
          - MLXFFT
      - package: SwiftCloudflared
        product: Cloudflared
      - package: SwiftMosh
        products:
          - MoshCore
          - MoshBootstrap
      - package: SwiftET
        products:
          - ETSession
          - ETBootstrap
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: OpenTelemetrySwift
        product: OpenTelemetryProtocolExporterHTTP
      - package: OpenTelemetrySwiftCore
        products:
          - OpenTelemetryApi
          - OpenTelemetrySdk
      - sdk: AppIntents.framework
    settings:
      base: &orlix_application_settings
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Orlix/Orlix-iOS/Orlix.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(ORLIX_PROVISIONING_PROFILE_SPECIFIER)
        DEAD_CODE_STRIPPING: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        HEADER_SEARCH_PATHS[sdk=iphoneos*]:
          - $(SRCROOT)/Orlix/Vendor/libghostty/ios/include
          - $(SRCROOT)/Orlix/Vendor/libssh2/include
        HEADER_SEARCH_PATHS[sdk=iphonesimulator*]:
          - $(SRCROOT)/Orlix/Vendor/libghostty/ios-simulator/include
          - $(SRCROOT)/Orlix/Vendor/libssh2/include
        INFOPLIST_FILE: Orlix/Orlix-iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Orlix
        INFOPLIST_KEY_CFBundleName: Orlix
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - $(SRCROOT)/Orlix/Vendor/libghostty/ios/lib
          - $(SRCROOT)/Orlix/Vendor/libssh2/ios/lib
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
          - $(SRCROOT)/Orlix/Vendor/libghostty/ios-simulator/lib
          - $(SRCROOT)/Orlix/Vendor/libssh2/ios-simulator/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lghostty
          - -lssh2
          - -lssl
          - -lcrypto
          - -lc++
          - -lz
          - -framework
          - Metal
          - -framework
          - QuartzCore
          - -framework
          - UIKit
        OTHER_MTLFLAGS: -Wno-c++17-extensions
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.orlix
        PRODUCT_NAME: Orlix
        APP_REVIEW_CODE: ORLIX-REVIEW-2026
        ORLIX_ANALYTICS_ENABLED: NO
        ORLIX_OBSERVABILITY_ENABLED: NO
        ORLIX_OPENPANEL_TRACK_ENDPOINT: https://analytics.orlix.rudironsoni.cloud/track
