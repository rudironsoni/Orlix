name: Orlix
options:
  bundleIdPrefix: com.rudironsoni
  deploymentTarget:
    iOS: "16.1"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: OrlixOS/Sources/distribution/target-settings.xcconfig
  Release: OrlixOS/Sources/distribution/target-settings.xcconfig
settings:
  base:
    ARCHS[sdk=iphonesimulator*]: arm64
    CLANG_ENABLE_MODULES: YES
    CURRENT_PROJECT_VERSION: 35
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS:
      - $(inherited)
      - ORLIX_BETA_OBSERVABILITY
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - DEBUG=1
        - ORLIX_APP_HOSTED_BOOT=1
        - ORLIX_BETA_OBSERVABILITY=1
      SWIFT_ACTIVE_COMPILATION_CONDITIONS:
        - $(inherited)
        - DEBUG
        - ORLIX_BETA_OBSERVABILITY
    Release:
      GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - ORLIX_APP_HOSTED_BOOT=1
        - ORLIX_BETA_OBSERVABILITY=1
packages:
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    revision: 072b684acaae80b6a463abab3a103732f33774bf
  SwiftCloudflared:
    url: https://github.com/wiedymi/swift-cloudflared.git
    revision: 1be78afe5dae7a20ce0837ce34085f03a77f7587
  SwiftMosh:
    url: https://github.com/wiedymi/swift-mosh
    revision: bb4eacdf65303b2ecce624a91e98298c4ee94fca
  SwiftNumerics:
    url: https://github.com/apple/swift-numerics
    revision: 0c0290ff6b24942dadb83a929ffaaa1481df04a2
  TweetNaclSwiftwrap:
    url: https://github.com/bitmark-inc/tweetnacl-swiftwrap.git
    revision: a7776eb5388467ec553b855846e24438288e2da5
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    revision: 22787ffb59de99e5dc1fbfe80b19c97a904ad48d
  OpenTelemetrySwift:
    url: https://github.com/open-telemetry/opentelemetry-swift.git
    revision: 9a6d6a8aed22c415bb1673206e337824635f818b
  OpenTelemetrySwiftCore:
    url: https://github.com/open-telemetry/opentelemetry-swift-core.git
    revision: 06f8a460a66f813758d22f09025d85df45450a63
targets:
  OrlixKernel:
    type: framework
    platform: iOS
    sources:
      - path: OrlixKernel/Sources/boot
        includes:
          - "*.c"
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/boot
        includes:
          - "*.c"
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/terminal
        includes:
          - "*.c"
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/memory
        includes:
          - "*.c"
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/observability
        includes:
          - "*.c"
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/runtime
        includes:
          - "*.c"
      - path: OrlixKernel/Sources/include
        buildPhase: headers
        headerVisibility: public
    dependencies:
      - sdk: CoreFoundation.framework
    preBuildScripts:
      - name: Build OrlixKernel Archive
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          profile="${ORLIX_PROFILE:-release}"
          platform="${PLATFORM_NAME:?}"
          build_root="${ORLIX_BUILD_ROOT:-$SRCROOT/Build}"
          case "$platform" in
              iphoneos|iphonesimulator) ;;
              *) echo "unsupported OrlixKernel archive platform: $platform" >&2; exit 1 ;;
          esac
          "${MAKE:-make}" -f "$SRCROOT/OrlixKernel/Makefile" __kernel-archive PROFILE="$profile" ORLIX_BUILD_ROOT="$build_root" ORLIX_KERNEL_ARCHIVE_PLATFORMS="$platform"
          archive="$build_root/OrlixKernel/$profile/$platform/OrlixKernel.a"
          if [ ! -s "$archive" ]; then
              echo "missing OrlixKernel archive: $archive" >&2
              exit 1
          fi
          mkdir -p "$TARGET_TEMP_DIR"
          if [ ! -s "$TARGET_TEMP_DIR/OrlixKernel.a" ] || ! cmp -s "$archive" "$TARGET_TEMP_DIR/OrlixKernel.a"; then
              cp -f "$archive" "$TARGET_TEMP_DIR/OrlixKernel.a"
          else
              echo "Reusing unchanged OrlixKernel archive."
          fi
    settings:
      base:
        CLANG_ENABLE_MODULE_VERIFIER: YES
        DEFINES_MODULE: YES
        INFOPLIST_FILE: OrlixKernel/Sources/Support/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixKernel
        PRODUCT_NAME: OrlixKernel
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/OrlixKernel/Sources
          - $(SRCROOT)/OrlixKernel/Sources/include
          # Temporary arch boot seam include only. Do not add generic Linux
          # or generated Kbuild include roots to Xcode targets.
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/overlay/arch/orlix/include
          - $(SRCROOT)/OrlixHostAdapter/Sources
        OTHER_LDFLAGS:
          - $(inherited)
          - $(TARGET_TEMP_DIR)/OrlixKernel.a
        ARCHS[sdk=iphonesimulator*]: arm64
      GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - ORLIX_APP_HOSTED_BOOT=1
        - ORLIX_BETA_OBSERVABILITY=1
  OrlixOS:
    type: framework
    platform: iOS
    sources:
      - path: OrlixOS/Sources/Session
    dependencies:
      - target: OrlixKernel
      - sdk: libz.tbd
    postBuildScripts:
      - name: Embed OrlixOS Payload
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/OrlixOS/Makefile
          - $(SRCROOT)/OrlixOS/Sources/distribution/target-settings.xcconfig
          - $(SRCROOT)/OrlixOS/Sources/init
          - $(SRCROOT)/OrlixOS/Sources/make
          - $(SRCROOT)/OrlixOS/Sources/make/rules.mk
          - $(SRCROOT)/OrlixKernel/Makefile
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/configs
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/kbuild/kernel-rules.mk
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/kbuild/product-compile-adapter.mk
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/overlay
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/patches
          - $(SRCROOT)/tools/runtime/orlix-sync-payload.sh
          - $(SRCROOT)/OrlixOS/Makefile
          - $(SRCROOT)/OrlixOS/Sources/distribution/manifest.mk
          - $(SRCROOT)/OrlixOS/Sources/init/init.c
          - $(SRCROOT)/OrlixOS/Sources/init/rootinit.c
          - $(SRCROOT)/OrlixOS/Sources/make/config.mk
          - $(SRCROOT)/OrlixOS/Sources/make/packages.mk
          - $(SRCROOT)/OrlixOS/Sources/make/rootfs.mk
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/.orlix-payload-ready
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/rootfs
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/rootfs/initramfs.cpio.gz
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/rootfs/base.ext4
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/rootfs/state.ext4
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/arch
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/arch/orlix
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/arch/orlix/boot
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/arch/orlix/boot/dts
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/arch/orlix/boot/dts/development.dtb
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/$(ORLIX_OS_PAYLOAD_BUNDLE_NAME).$(ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION)/arch/orlix/boot/dts/release.dtb
        script: |
          set -eu
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          build_root="${ORLIX_BUILD_ROOT:-$SRCROOT/Build}"
          ORLIX_BUILD_ROOT="$build_root"
          if [ "${ORLIX_OS_SKIP_PAYLOAD_EMBED:-NO}" = YES ]; then
              echo "Skipping OrlixOS payload embed because ORLIX_OS_SKIP_PAYLOAD_EMBED=YES"
              exit 0
          fi
          profile="${ORLIX_PROFILE:-release}"
          payload_name="${ORLIX_OS_PAYLOAD_BUNDLE_NAME:?}"
          payload_extension="${ORLIX_OS_PAYLOAD_BUNDLE_EXTENSION:?}"
          source_payload_name="${ORLIX_OS_PAYLOAD_SOURCE_BUNDLE_NAME:?}"
          ORLIX_OS_PAYLOAD_SOURCE_ROOT="$ORLIX_BUILD_ROOT/OrlixKernel/payload"
          ORLIX_OS_ROOT_INITRAMFS_INPUT="$ORLIX_BUILD_ROOT/OrlixOS/rootfs/$profile/rootfs/initramfs.cpio.gz"
          ORLIX_OS_BASE_ROOT_TREE_INPUT="$ORLIX_BUILD_ROOT/OrlixOS/rootfs/$profile/base-tree"
          ORLIX_OS_STATE_ROOT_TREE_INPUT="$ORLIX_BUILD_ROOT/OrlixOS/rootfs/$profile/state-tree"
          payload="$ORLIX_OS_PAYLOAD_SOURCE_ROOT/$source_payload_name.$payload_extension"
          if [ "${ORLIX_OS_EXPECTED_ROOTFS_INPUT+x}" = x ]; then
              expected_rootfs_input="$ORLIX_OS_EXPECTED_ROOTFS_INPUT"
          else
              expected_rootfs_input="$ORLIX_OS_ROOT_INITRAMFS_INPUT"
          fi
          if [ "${ORLIX_OS_EXPECTED_BASE_ROOT_TREE_INPUT+x}" = x ]; then
              expected_base_root_tree_input="$ORLIX_OS_EXPECTED_BASE_ROOT_TREE_INPUT"
          else
              expected_base_root_tree_input="$ORLIX_OS_BASE_ROOT_TREE_INPUT"
          fi
          if [ "${ORLIX_OS_EXPECTED_STATE_ROOT_TREE_INPUT+x}" = x ]; then
              expected_state_root_tree_input="$ORLIX_OS_EXPECTED_STATE_ROOT_TREE_INPUT"
          else
              expected_state_root_tree_input="$ORLIX_OS_STATE_ROOT_TREE_INPUT"
          fi
          stamp="$payload/.orlix-payload-ready"
          payload_needs_rebuild=0
          if [ ! -d "$payload" ] || [ ! -s "$stamp" ]; then
              payload_needs_rebuild=1
          else
              rootfs_input="$(sed -n 's/^rootfs_input=//p' "$stamp")"
              base_root_tree_input="$(sed -n 's/^base_root_tree_input=//p' "$stamp")"
              state_root_tree_input="$(sed -n 's/^state_root_tree_input=//p' "$stamp")"
              if [ "$rootfs_input" != "$expected_rootfs_input" ] ||
                 { [ -n "$expected_base_root_tree_input" ] && [ "$base_root_tree_input" != "$expected_base_root_tree_input" ]; } ||
                 { [ -n "$expected_state_root_tree_input" ] && [ "$state_root_tree_input" != "$expected_state_root_tree_input" ]; }; then
                  payload_needs_rebuild=1
              fi
          fi
          if [ "$payload_needs_rebuild" = 1 ]; then
              "${MAKE:-make}" -f "$SRCROOT/OrlixOS/Makefile" kernel-payload PROFILE="$profile" ORLIX_BUILD_ROOT="$ORLIX_BUILD_ROOT"
          else
            payload_inputs="
              $SRCROOT/OrlixOS/Makefile
              $SRCROOT/OrlixOS/Sources/distribution/manifest.mk
              $SRCROOT/OrlixOS/Sources/distribution/target-settings.xcconfig
              $SRCROOT/OrlixOS/Sources/init/init.c
            $SRCROOT/OrlixOS/Sources/init/rootinit.c
            $SRCROOT/OrlixOS/Sources/make/config.mk
            $SRCROOT/OrlixOS/Sources/make/packages.mk
            $SRCROOT/OrlixOS/Sources/make/rootfs.mk
            $SRCROOT/OrlixKernel/Makefile
            $SRCROOT/OrlixKernel/Sources/ports/orlix/configs
            $SRCROOT/OrlixKernel/Sources/ports/orlix/kbuild/kernel-rules.mk
            $SRCROOT/OrlixKernel/Sources/ports/orlix/kbuild/product-compile-adapter.mk
            $SRCROOT/OrlixKernel/Sources/ports/orlix/overlay
            $SRCROOT/OrlixKernel/Sources/ports/orlix/patches
                        "
              for payload_input in $payload_inputs; do
                  if [ -e "$payload_input" ] && [ "$payload_input" -nt "$stamp" ]; then
                      payload_needs_rebuild=1
                      break
                  fi
              done
              if [ "$payload_needs_rebuild" = 1 ]; then
              "${MAKE:-make}" -f "$SRCROOT/OrlixOS/Makefile" kernel-payload PROFILE="$profile" ORLIX_BUILD_ROOT="$ORLIX_BUILD_ROOT"
              fi
          fi
          if [ ! -d "$payload" ]; then
              echo "missing OrlixOS payload bundle after packaging: $payload" >&2
              exit 1
          fi
          if [ ! -s "$stamp" ]; then
              echo "missing OrlixOS payload stamp after packaging: $stamp" >&2
              exit 1
          fi
          rootfs_input="$(sed -n 's/^rootfs_input=//p' "$stamp")"
          base_root_tree_input="$(sed -n 's/^base_root_tree_input=//p' "$stamp")"
          state_root_tree_input="$(sed -n 's/^state_root_tree_input=//p' "$stamp")"
          case "$rootfs_input" in
              "$expected_rootfs_input") ;;
              *)
                  echo "OrlixOS payload is not packaged from the expected rootfs: $rootfs_input" >&2
                  echo "expected: $expected_rootfs_input" >&2
                  exit 1
                  ;;
          esac
          if [ -n "$expected_base_root_tree_input" ]; then
              case "$base_root_tree_input" in
                  "$expected_base_root_tree_input") ;;
                  *)
                      echo "OrlixOS payload is missing the expected base root tree: $base_root_tree_input" >&2
                      echo "expected: $expected_base_root_tree_input" >&2
                      exit 1
                      ;;
              esac
          fi
          if [ -n "$expected_state_root_tree_input" ]; then
              case "$state_root_tree_input" in
                  "$expected_state_root_tree_input") ;;
                  *)
                      echo "OrlixOS payload is missing the expected state root tree: $state_root_tree_input" >&2
                      echo "expected: $expected_state_root_tree_input" >&2
                      exit 1
                      ;;
              esac
          fi
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/$payload_name.$payload_extension"
          "$SRCROOT/tools/runtime/orlix-sync-payload.sh" "$payload" "$destination"
    settings:
      base:
        CLANG_ENABLE_MODULE_VERIFIER: YES
        DEFINES_MODULE: YES
        INFOPLIST_FILE: OrlixOS/Sources/Session/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixOS
        PRODUCT_NAME: OrlixOS
  OrlixOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrlixOS/Tests/XCTest/OrlixOSTests
    dependencies:
      - target: OrlixTestRunner
      - target: OrlixOS
      - sdk: libz.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixOSTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrlixTestRunner.app/OrlixTestRunner
        BUNDLE_LOADER: $(TEST_HOST)
  Orlix:
    type: application
    platform: iOS
    sources:
      - path: Orlix/App/Orlix/App
      - path: Orlix/App/Orlix/Compatibility
      - path: Orlix/App/Orlix/Core
      - path: Orlix/App/Orlix/Features
      - path: Orlix/App/Orlix/Generated
      - path: Orlix/App/Orlix/GhosttyTerminal
      - path: Orlix/App/OrlixShared
      - path: Orlix/App/Orlix/Core/Analytics/OrlixTelemetry.swift
      - path: Orlix/App/Orlix/Assets.xcassets
        buildPhase: resources
      - path: Orlix/App/Orlix/Resources
        buildPhase: resources
        excludes:
          - Assets.xcassets
          - ghostty
          - terminfo
      - path: Orlix/App/Orlix/Resources/Assets.xcassets
        buildPhase: resources
      - path: Orlix/App/Orlix/Resources/ghostty
        buildPhase: resources
        type: folder
      - path: Orlix/App/Orlix/Resources/terminfo
        buildPhase: resources
        type: folder
      - path: Orlix/App/Orlix/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: docs/sources/release/orlix-app-release-inputs.json
        buildPhase: resources
    dependencies:
      - target: OrlixOS
        embed: true
      - target: OrlixKernel
        embed: true
      - target: OrlixLiveActivity
        embed: true
      - package: MLXSwift
        products:
          - MLX
          - MLXNN
          - MLXFFT
      - package: SwiftCloudflared
        product: Cloudflared
      - package: SwiftMosh
        products:
          - MoshCore
          - MoshBootstrap
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: OpenTelemetrySwift
        product: OpenTelemetryProtocolExporterHTTP
      - package: OpenTelemetrySwiftCore
        products:
          - OpenTelemetryApi
          - OpenTelemetrySdk
      - sdk: AppIntents.framework
    settings:
      base:
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Orlix/App/Orlix-iOS/Orlix.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(ORLIX_PROVISIONING_PROFILE_SPECIFIER)
        DEAD_CODE_STRIPPING: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        HEADER_SEARCH_PATHS[sdk=iphoneos*]:
          - $(SRCROOT)/Orlix/App/Vendor/libghostty/ios/include
          - $(SRCROOT)/Orlix/App/Vendor/libssh2/include
        HEADER_SEARCH_PATHS[sdk=iphonesimulator*]:
          - $(SRCROOT)/Orlix/App/Vendor/libghostty/ios-simulator/include
          - $(SRCROOT)/Orlix/App/Vendor/libssh2/include
        INFOPLIST_FILE: Orlix/App/Orlix-iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Orlix
        INFOPLIST_KEY_CFBundleName: Orlix
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - $(SRCROOT)/Orlix/App/Vendor/libghostty/ios/lib
          - $(SRCROOT)/Orlix/App/Vendor/libssh2/ios/lib
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
          - $(SRCROOT)/Orlix/App/Vendor/libghostty/ios-simulator/lib
          - $(SRCROOT)/Orlix/App/Vendor/libssh2/ios-simulator/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lghostty
          - -lssh2
          - -lssl
          - -lcrypto
          - -lc++
          - -lz
          - -framework
          - Metal
          - -framework
          - QuartzCore
          - -framework
          - UIKit
        OTHER_MTLFLAGS: -Wno-c++17-extensions
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.Orlix
        PRODUCT_NAME: Orlix
        ORLIX_ANALYTICS_ENABLED: NO
        ORLIX_OBSERVABILITY_ENABLED: NO
        ORLIX_OPENPANEL_TRACK_ENDPOINT: https://analytics.orlix.rudironsoni.cloud/track
        ORLIX_SIGNOZ_OTLP_HTTP_ENDPOINT: https://otlp.orlix.rudironsoni.cloud
        ORLIX_TELEMETRY_ENVIRONMENT: development
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Orlix/App/Orlix/ghostty-bridging-header.h
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1,2
      configs:
        Debug:
          APS_ENVIRONMENT: development
          ORLIX_TELEMETRY_ENVIRONMENT: simulator-validation
        Release:
          APS_ENVIRONMENT: production
          ORLIX_TELEMETRY_ENVIRONMENT: testflight
  OrlixLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Orlix/App/OrlixLiveActivity
        excludes:
          - Assets.xcassets
          - Info.plist
      - path: Orlix/App/OrlixShared
    resources:
      - path: Orlix/App/OrlixLiveActivity/Assets.xcassets
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Orlix/App/OrlixLiveActivity/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.Orlix.liveactivity
        PRODUCT_NAME: OrlixLiveActivity
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1,2
  OrlixAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Orlix/App/OrlixTests
    dependencies:
      - target: Orlix
      - package: SwiftMosh
        product: MoshBootstrap
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS[sdk=iphoneos*]:
          - $(SRCROOT)/Orlix/App/Vendor/libghostty/ios/include
          - $(SRCROOT)/Orlix/App/Vendor/libssh2/include
        HEADER_SEARCH_PATHS[sdk=iphonesimulator*]:
          - $(SRCROOT)/Orlix/App/Vendor/libghostty/ios-simulator/include
          - $(SRCROOT)/Orlix/App/Vendor/libssh2/include
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixAppTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Orlix.app/Orlix
        BUNDLE_LOADER: $(TEST_HOST)
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1,2
  OrlixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Orlix/App/OrlixUITests
    dependencies:
      - target: Orlix
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixUITests
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1,2
        TEST_TARGET_NAME: Orlix
  OrlixTestRunner:
    type: application
    platform: iOS
    sources:
      - path: OrlixTestRunner/Sources
    dependencies:
      - target: OrlixOS
        embed: true
      - target: OrlixKernel
        embed: true
    postBuildScripts:
      - name: Embed Orlix Upstream Test Rootfs Bundles
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          profile="${ORLIX_PROFILE:-release}"
          build_root="${ORLIX_BUILD_ROOT:-$SRCROOT/Build}"
          ORLIX_BUILD_ROOT="$build_root"
          rebuild_kselftest_if_stale() {
            source_root="$ORLIX_BUILD_ROOT/OrlixMLibC/test-initramfs/$profile/$ORLIX_OS_KSELFTEST_INITRAMFS_BUNDLE_NAME.$extension"
            archive="$source_root/rootfs/initramfs.cpio.gz"
              needs_rebuild=0
              if [ ! -s "$archive" ]; then
                  needs_rebuild=1
              elif find "$SRCROOT/OrlixKernel/Sources/ports/orlix/overlay/tools/testing/selftests/orlix" -type f \( -name '*.c' -o -name '*.h' -o -name Makefile \) -newer "$archive" -print -quit | grep -q .; then
                  needs_rebuild=1
              elif [ "$SRCROOT/OrlixKernel/Sources/ports/orlix/kbuild/kernel-rules.mk" -nt "$archive" ]; then
                  needs_rebuild=1
              fi
            if [ "$needs_rebuild" -eq 1 ]; then
                make -f "$SRCROOT/OrlixKernel/Makefile" kselftest PROFILE="$profile" ORLIX_BUILD_ROOT="$ORLIX_BUILD_ROOT" libc=orlixmlibc
            fi
          }
          rebuild_mlibc_if_stale() {
            source_root="$ORLIX_BUILD_ROOT/OrlixMLibC/test-initramfs/$profile/$ORLIX_OS_MLIBC_INITRAMFS_BUNDLE_NAME.$extension"
            archive="$source_root/rootfs/initramfs.cpio.gz"
            needs_rebuild=0
            if [ ! -s "$archive" ]; then
                needs_rebuild=1
            elif [ "$SRCROOT/OrlixMLibC/Makefile" -nt "$archive" ]; then
                needs_rebuild=1
            elif find "$SRCROOT/OrlixMLibC/Tests" "$SRCROOT/OrlixMLibC/Sources" -type f \( -name '*.c' -o -name '*.h' -o -name '*.hpp' -o -name '*.patch' -o -name Makefile \) -newer "$archive" -print -quit | grep -q .; then
                needs_rebuild=1
            elif [ -s "$ORLIX_BUILD_ROOT/OrlixMLibC/sysroot/$profile/.orlixmlibc-sysroot-ready" ] && [ "$ORLIX_BUILD_ROOT/OrlixMLibC/sysroot/$profile/.orlixmlibc-sysroot-ready" -nt "$archive" ]; then
                needs_rebuild=1
            fi
            if [ "$needs_rebuild" -eq 1 ]; then
                make -f "$SRCROOT/OrlixMLibC/Makefile" test-initramfs PROFILE="$profile" ORLIX_BUILD_ROOT="$ORLIX_BUILD_ROOT"
            fi
          }
          copy_if_present() {
            source="$1"
            name="$2"
              destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/$name"
              if [ -d "$source" ]; then
                  rm -rf "$destination"
                  cp -R "$source" "$destination"
              fi
          }
          extension="${ORLIX_OS_TEST_INITRAMFS_BUNDLE_EXTENSION:?}"
          rebuild_kselftest_if_stale
          rebuild_mlibc_if_stale
          copy_if_present "$ORLIX_BUILD_ROOT/OrlixMLibC/test-initramfs/$profile/$ORLIX_OS_KSELFTEST_INITRAMFS_BUNDLE_NAME.$extension" "$ORLIX_OS_KSELFTEST_INITRAMFS_BUNDLE_NAME.$extension"
          copy_if_present "$ORLIX_BUILD_ROOT/OrlixMLibC/test-initramfs/$profile/$ORLIX_OS_MLIBC_INITRAMFS_BUNDLE_NAME.$extension" "$ORLIX_OS_MLIBC_INITRAMFS_BUNDLE_NAME.$extension"
          copy_if_present "$ORLIX_BUILD_ROOT/OrlixOS/test-initramfs/$profile/$ORLIX_OS_COREUTILS_INITRAMFS_BUNDLE_NAME.$extension" "$ORLIX_OS_COREUTILS_INITRAMFS_BUNDLE_NAME.$extension"
          if [ "${ORLIX_OS_SKIP_ENVIRONMENT_RUNTIME_FIXTURES:-NO}" != YES ]; then
              "${MAKE:-make}" -f "$SRCROOT/OrlixOS/Makefile" environment-runtime-test-fixtures PROFILE="$profile" ORLIX_BUILD_ROOT="$ORLIX_BUILD_ROOT"
              copy_if_present "$ORLIX_BUILD_ROOT/OrlixOS/environment-runtime-test-fixtures" "EnvironmentRuntimeTestFixtures"
          else
              rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/EnvironmentRuntimeTestFixtures"
          fi
    settings:
      base:
        CLANG_ENABLE_MODULE_VERIFIER: YES
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixTestRunner
        PRODUCT_NAME: OrlixTestRunner
  OrlixKernelHostedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrlixKernel/Tests/XCTest/OrlixKernelHostedTests
    dependencies:
      - target: Orlix
      - target: OrlixKernel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixKernelHostedTests
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/OrlixKernel/Sources/include
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - ORLIX_APP_HOSTED_BOOT=1
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Orlix.app/Orlix
        BUNDLE_LOADER: $(TEST_HOST)
  OrlixKernelLogParserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrlixKernel/Tests/XCTest/OrlixKernelLogParserTests
      - path: OrlixKernel/Tests/Fixtures/KUnit
        type: folder
        buildPhase: resources
      - path: OrlixKernel/Tests/Fixtures/Kselftest
        type: folder
        buildPhase: resources
    dependencies:
      - target: Orlix
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixKernelLogParserTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Orlix.app/Orlix
        BUNDLE_LOADER: $(TEST_HOST)
  OrlixHostAdapterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrlixHostAdapter/Tests/XCTest/OrlixHostAdapterTests
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/boot
        includes:
          - progress.c
          - resources.c
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/terminal
        includes:
          - console.c
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/memory
        includes:
          - kernel_mapping.c
      - path: OrlixHostAdapter/Sources/OrlixHostAdapter/observability
        includes:
          - log.c
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixHostAdapterTests
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/OrlixHostAdapter/Sources
          - $(SRCROOT)/OrlixKernel/Sources/ports/orlix/overlay/arch/orlix/include
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - ORLIX_HOST_ADAPTER_TEST_LINUX_PAGE_SIZE=$(ORLIX_OS_LINUX_PAGE_SIZE)
  OrlixTestRunnerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrlixTestRunner/Tests/XCTest/OrlixTestRunnerTests
    dependencies:
      - target: OrlixTestRunner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixTestRunnerTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrlixTestRunner.app/OrlixTestRunner
        BUNDLE_LOADER: $(TEST_HOST)
  OrlixKernelConformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrlixTestRunner/Tests/XCTest/Support
      - path: OrlixTestRunner/Tests/XCTest/OrlixKernelConformanceTests
    dependencies:
      - target: OrlixTestRunner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixKernelConformanceTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrlixTestRunner.app/OrlixTestRunner
        BUNDLE_LOADER: $(TEST_HOST)
  OrlixMLibCConformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrlixTestRunner/Tests/XCTest/Support
      - path: OrlixTestRunner/Tests/XCTest/OrlixMLibCConformanceTests
    dependencies:
      - target: OrlixTestRunner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixMLibCConformanceTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrlixTestRunner.app/OrlixTestRunner
        BUNDLE_LOADER: $(TEST_HOST)
  OrlixPackagesConformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrlixTestRunner/Tests/XCTest/Support
      - path: OrlixTestRunner/Tests/XCTest/OrlixPackagesConformanceTests
    dependencies:
      - target: OrlixTestRunner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixPackagesConformanceTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrlixTestRunner.app/OrlixTestRunner
        BUNDLE_LOADER: $(TEST_HOST)
  OrlixRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrlixTestRunner/Tests/XCTest/OrlixRuntimeTests
    dependencies:
      - target: OrlixTestRunner
      - target: OrlixOS
    postBuildScripts:
      - name: Build Orlix Environment Runtime Proof Fixtures
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          profile="${ORLIX_PROFILE:-release}"
          "${MAKE:-make}" -f "$SRCROOT/OrlixOS/Makefile" environment-runtime-test-fixtures PROFILE="$profile"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.OrlixRuntimeTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrlixTestRunner.app/OrlixTestRunner
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  OrlixKernel:
    build:
      targets:
        OrlixKernel: all
  Orlix:
    build:
      targets:
        Orlix: all
    run:
      config: Debug
      executable: Orlix
      storeKitConfiguration: Orlix/App/OrlixStoreKit.storekit
    archive:
      config: Release
  "OrlixOS Tests":
    build:
      targets:
        OrlixTestRunner: all
        OrlixOSTests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OrlixOSTests
  "OrlixKernel Hosted Tests":
    build:
      targets:
        Orlix: all
        OrlixKernelHostedTests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OrlixKernelHostedTests
  "Orlix App Tests":
    build:
      targets:
        Orlix: all
        OrlixAppTests: test
        OrlixUITests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OrlixAppTests
        - name: OrlixUITests
  "Orlix Release UI Tests":
    build:
      targets:
        Orlix: all
        OrlixUITests: test
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - name: OrlixUITests
  "OrlixKernel Log Parser Tests":
    build:
      targets:
        Orlix: all
        OrlixKernelLogParserTests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OrlixKernelLogParserTests
  "OrlixHostAdapter Tests":
    build:
      targets:
        OrlixHostAdapterTests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OrlixHostAdapterTests
  "OrlixTestRunner Tests":
    build:
      targets:
        OrlixTestRunner: all
        OrlixTestRunnerTests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OrlixTestRunnerTests
  "OrlixRuntime Tests":
    build:
      targets:
        OrlixTestRunner: all
        OrlixRuntimeTests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OrlixRuntimeTests
          selectedTests:
            - OrlixRuntimeTests/testLinuxPTYCarriesInteractiveShellInputAndOutput
  "OrlixKernel Conformance":
    build:
      targets:
        OrlixTestRunner: all
        OrlixKernelConformanceTests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OrlixKernelConformanceTests
  "OrlixMLibC Conformance":
    build:
      targets:
        OrlixTestRunner: all
        OrlixMLibCConformanceTests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OrlixMLibCConformanceTests
  "OrlixPackages Conformance":
    build:
      targets:
        OrlixTestRunner: all
        OrlixPackagesConformanceTests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OrlixPackagesConformanceTests
