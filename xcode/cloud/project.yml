name: OrlixCloud
options:
  deploymentTarget:
    iOS: "15.0"
  generateEmptyDirectories: false
settings:
  base:
    ARCHS[sdk=iphonesimulator*]: arm64
    CODE_SIGN_IDENTITY: iPhone Developer
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 42
    DEVELOPMENT_TEAM: ZQ3L7M567L
    ENABLE_DEBUG_DYLIB: NO
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1"
    PROVISIONING_PROFILE_SPECIFIER: $(ORLIX_PROVISIONING_PROFILE_SPECIFIER)
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  OrlixCloud:
    type: application
    platform: iOS
    sources:
      - path: xcode/cloud/OrlixCloudApp.swift
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: xcode/cloud/OrlixCloud.entitlements
        CODE_SIGN_IDENTITY: iPhone Developer
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZQ3L7M567L
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: xcode/cloud/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rudironsoni.orlix
        PROVISIONING_PROFILE_SPECIFIER: $(ORLIX_PROVISIONING_PROFILE_SPECIFIER)
    preBuildScripts:
      - name: Make Bazel Feasibility Bootstrap
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:/opt/homebrew/opt/lld/bin:/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          make -C "${SRCROOT}" __bazel-feasibility-bootstrap
schemes:
  OrlixCloud:
    build:
      targets:
        OrlixCloud: all
    archive:
      config: Release
